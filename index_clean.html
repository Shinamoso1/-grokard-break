<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>グロカード / ブレイク値</title>
<style>
body{margin:0;background:#000;color:#fff;font-family:Arial,sans-serif}
main{max-width:700px;margin:auto;padding:24px 18px 90px}
h1{font-size:28px;margin:0 0 32px}
h2{font-size:21px;font-weight:400;margin:0 0 10px}
section{margin-bottom:32px}
.item{display:flex;align-items:center;min-height:48px;font-size:19px}
.name{flex:1}
.num{width:70px;text-align:right}
button{font:inherit;color:#fff;background:#111;border:1px solid #555}
.check{width:40px;height:40px;border-radius:9px;margin-left:10px}
.check.on{background:#fff;color:#000}
.armor{display:flex;align-items:center;min-height:52px;font-size:19px}
.armor .name{flex:1}
.ctrl{display:flex;align-items:center;gap:6px}
.ctrl button{width:34px;height:34px;border-radius:50%;font-size:21px}
.count{width:24px;text-align:center}
.sub{width:55px;text-align:right}
.total{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);width:min(664px,calc(100% - 36px));padding:13px 16px;background:#181818;border:1px solid #555;border-radius:12px;display:flex;justify-content:space-between}
.total strong{font-size:26px}
</style>
</head>
<body>
<main>
<h1>グロカード / ブレイク値</h1>

<section>
<h2>防具</h2>
<div class="armor" data-v="43"><span class="name">ミーナ</span><div class="ctrl"><button onclick="change(this,-1)">−</button><span class="count">0</span><button onclick="change(this,1)">＋</button></div><span class="sub">0</span></div>
<div class="armor" data-v="43"><span class="name">ルイス</span><div class="ctrl"><button onclick="change(this,-1)">−</button><span class="count">0</span><button onclick="change(this,1)">＋</button></div><span class="sub">0</span></div>
<div class="armor" data-v="59"><span class="name">ルーロン</span><div class="ctrl"><button onclick="change(this,-1)">−</button><span class="count">0</span><button onclick="change(this,1)">＋</button></div><span class="sub">0</span></div>
<div class="armor" data-v="81"><span class="name">もさもさ</span><div class="ctrl"><button onclick="change(this,-1)">−</button><span class="count">0</span><button onclick="change(this,1)">＋</button></div><span class="sub">0</span></div>
<div class="armor" data-v="124"><span class="name">かまいたち</span><div class="ctrl"><button onclick="change(this,-1)">−</button><span class="count">0</span><button onclick="change(this,1)">＋</button></div><span class="sub">0</span></div>
<div class="armor" data-v="143"><span class="name">天狗ラクーム</span><div class="ctrl"><button onclick="change(this,-1)">−</button><span class="count">0</span><button onclick="change(this,1)">＋</button></div><span class="sub">0</span></div>
<div class="armor" data-v="151"><span class="name">ざしこ</span><div class="ctrl"><button onclick="change(this,-1)">−</button><span class="count">0</span><button onclick="change(this,1)">＋</button></div><span class="sub">0</span></div>
<div class="armor" data-v="180"><span class="name">ミレイユ</span><div class="ctrl"><button onclick="change(this,-1)">−</button><span class="count">0</span><button onclick="change(this,1)">＋</button></div><span class="sub">0</span></div>
</section>

<section>
<h2>武器</h2>
<div class="item" data-v="150"><span class="name">レムルス</span><span class="num">150</span><button class="check" onclick="toggle(this)">○</button></div>
<div class="item" data-v="175"><span class="name">レムルス スキル</span><span class="num">175</span><button class="check" onclick="toggle(this)">○</button></div>
<div class="item" data-v="200"><span class="name">スズ</span><span class="num">200</span><button class="check" onclick="toggle(this)">○</button></div>
<div class="item" data-v="200"><span class="name">スズ スキル</span><span class="num">200</span><button class="check" onclick="toggle(this)">○</button></div>
</section>

<section>
<h2>腕</h2>
<div class="item" data-v="120"><span class="name">童子切</span><span class="num">120</span><button class="check" onclick="toggle(this)">○</button></div>
<div class="item" data-v="100"><span class="name">童子切 スキル</span><span class="num">100</span><button class="check" onclick="toggle(this)">○</button></div>
<div class="item" data-v="180"><span class="name">アイリス</span><span class="num">180</span><button class="check" onclick="toggle(this)">○</button></div>
<div class="item" data-v="180"><span class="name">アイリス スキル</span><span class="num">180</span><button class="check" onclick="toggle(this)">○</button></div>
</section>

<section>
<h2>装飾品</h2>
<div class="item" data-v="98"><span class="name">チエ</span><span class="num">98</span><button class="check" onclick="toggle(this)">○</button></div>
<div class="item" data-v="98"><span class="name">コダマ</span><span class="num">98</span><button class="check" onclick="toggle(this)">○</button></div>
<div class="item" data-v="124"><span class="name">ファルナ</span><span class="num">124</span><button class="check" onclick="toggle(this)">○</button></div>
<div class="item" data-v="152"><span class="name">アモロウナグ</span><span class="num">152</span><button class="check" onclick="toggle(this)">○</button></div>
<div class="item" data-v="180"><span class="name">ヴィオーラ</span><span class="num">180</span><button class="check" onclick="toggle(this)">○</button></div>
<div class="item" data-v="200"><span class="name">白蔵主</span><span class="num">200</span><button class="check" onclick="toggle(this)">○</button></div>
</section>

<section>
<h2>頭</h2>
<div class="item" data-v="108"><span class="name">リオル</span><span class="num">108</span><button class="check" onclick="toggle(this)">○</button></div>
<div class="item" data-v="124"><span class="name">ククリ</span><span class="num">124</span><button class="check" onclick="toggle(this)">○</button></div>
<div class="item" data-v="180"><span class="name">キンナラ</span><span class="num">180</span><button class="check" onclick="toggle(this)">○</button></div>
<div class="item" data-v="200"><span class="name">鬼切丸</span><span class="num">200</span><button class="check" onclick="toggle(this)">○</button></div>
</section>
</main>

<div class="total"><span>合計ブレイク値</span><strong id="total">0</strong></div>

<script>
function update(){
  var total=0;
  document.querySelectorAll(".armor").forEach(function(x){
    var n=Number(x.querySelector(".count").textContent);
    var v=Number(x.dataset.v);
    x.querySelector(".sub").textContent=n*v;
    total+=n*v;
  });
  document.querySelectorAll(".item").forEach(function(x){
    if(x.querySelector(".check").classList.contains("on")) total+=Number(x.dataset.v);
  });
  document.getElementById("total").textContent=total;
}
function change(btn,delta){
  var x=btn.closest(".armor");
  var c=x.querySelector(".count");
  var n=Number(c.textContent)+delta;
  if(n<0)n=0;
  if(n>4)n=4;
  c.textContent=n;
  update();
}
function toggle(btn){
  btn.classList.toggle("on");
  btn.textContent=btn.classList.contains("on")?"✓":"○";
  update();
}
update();
</script>
</body>
</html>
