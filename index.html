<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>グロカード / ブレイク値</title><style>*{box-sizing:border-box}body{margin:0;background:#0b0b0f;color:#f5f5f7;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}.wrap{max-width:680px;margin:auto;padding:18px 14px 90px}h1{font-size:24px;margin:8px 0 4px}.sub,.hint{color:#9999a3;font-size:13px}.total{position:sticky;top:0;z-index:5;background:#15151bdF;backdrop-filter:blur(12px);border:1px solid #303039;border-radius:18px;padding:15px 18px;margin:18px 0 14px}.label{color:#aaaab3;font-size:13px}.num{font-size:42px;font-weight:800;line-height:1.1}.sec{background:#15151b;border:1px solid #292931;border-radius:16px;overflow:hidden;margin:12px 0}.sec h2{font-size:17px;margin:0;padding:14px 16px;border-bottom:1px solid #292931}.row{display:flex;align-items:center;gap:11px;padding:11px 14px;border-bottom:1px solid #25252c;min-height:52px}.row:last-child{border-bottom:0}.row input{width:22px;height:22px;accent-color:#58a6ff;flex:none}.name{flex:1;font-size:16px}.value{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}.bonus{background:#191924}.buttons{display:flex;gap:9px;margin:14px 0}button{border:1px solid #34343d;background:#1b1b22;color:#fff;border-radius:12px;padding:11px 14px;font-size:14px}.hint{line-height:1.5;margin-top:14px}</style></head><body><div class="wrap"><h1>グロカード / ブレイク値</h1><div class="sub">チェックした項目だけ自動で合計</div><div class="total"><div class="label">合計ブレイク値</div><div class="num" id="total">0</div></div><div id="app"></div><div class="buttons"><button id="reset">☑ すべて外す</button><button id="all">✓ すべてチェック</button></div><div class="hint">※「裏」の値は別チェックにしています。必要なものだけ入れられます。<br>※チェック状態はこの端末のブラウザに保存されます。</div></div><script>
const data=[
['グロカード / ブレイク値',[['ルーロン',59],['もさもさ',81],['かまいたち',124,15],['天狗ラクーム',143,15],['ざしこ',151,15],['ミレイユ',180,19]]],
['特殊',[['ルーロン → ざしこ',92,null]]],
['武器',[['レムルス',150],['スズ',200]]],
['腕',[['童子切',120],['アイリス',180]]],
['装飾品',[['チェ、コダマ',98],['ファルナ',124],['アモロウナグ',152],['ヴィオーラ',180],['白蔵主',200]]],
['頭',[['リオル',108],['ククリ',124],['キンナラ',180],['鬼切丸',200]]]
];
const app=document.getElementById('app'), boxes=[];let n=0;
for(const [title,items] of data){const sec=document.createElement('section');sec.className='sec';const h=document.createElement('h2');h.textContent=title;sec.append(h);for(const [name,val,back] of items){const id='c'+n++;const row=document.createElement('div');row.className='row'+(title==='特殊'?' bonus':'');const cb=document.createElement('input');cb.type='checkbox';cb.id=id;cb.dataset.value=val;boxes.push(cb);const lab=document.createElement('label');lab.className='name';lab.htmlFor=id;lab.textContent=name;const v=document.createElement('span');v.className='value';v.textContent='+'+val;row.append(cb,lab,v);sec.append(row);if(back!=null){const bid='c'+n++;const brow=document.createElement('div');brow.className='row';const b=document.createElement('input');b.type='checkbox';b.id=bid;b.dataset.value=back;boxes.push(b);const bl=document.createElement('label');bl.className='name';bl.htmlFor=bid;bl.textContent=name+'（裏）';const bv=document.createElement('span');bv.className='value';bv.textContent='+'+back;brow.append(b,bl,bv);sec.append(brow)}}app.append(sec)}
function update(){let t=0;boxes.forEach((b,i)=>{if(b.checked)t+=+b.dataset.value;localStorage.setItem('grokard_'+i,b.checked?'1':'0')});document.getElementById('total').textContent=t.toLocaleString('ja-JP')}
boxes.forEach((b,i)=>{b.checked=localStorage.getItem('grokard_'+i)==='1';b.addEventListener('change',update)});document.getElementById('reset').onclick=()=>{boxes.forEach(b=>b.checked=false);update()};document.getElementById('all').onclick=()=>{boxes.forEach(b=>b.checked=true);update()};update();
</script></body></html>
